name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Publishable values (safe to ship in the app; data is protected by RLS). Repo secrets override them.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://summcadnxnckemvpzojh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_Vojut9MapFQJWxA9Q0DV-A_3pCxbwV8' }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY || vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - name: Use the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" && ls $ANDROID_HOME
      - name: Check anonymous sign-in is enabled on Supabase (informational)
        continue-on-error: true
        run: |
          curl -s -X POST "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/signup" -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' -o resp.json -w "HTTP %{http_code}\n"
          python3 -c "import json;d=json.load(open('resp.json'));print('ANON_SIGNIN', 'OK' if d.get('access_token') else d.get('msg') or d.get('error_code') or d)"
      - run: npm ci
      - name: Type-check and unit tests
        run: npx tsc --noEmit && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Assemble release APK (signed with the debug key, for testing)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk the-unknown.apk
      - uses: actions/upload-artifact@v4
        with: { name: the-unknown-apk, path: the-unknown.apk }
      - name: Publish as a GitHub release for easy phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: THE UNKNOWN test build ${{ github.run_number }}
          files: the-unknown.apk
